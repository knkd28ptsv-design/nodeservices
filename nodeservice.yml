---
- name: Install systemd exporter on Linux servers
  hosts: all
  become: true
  become_method: sudo
  become_user: root
  gather_facts: true

  vars:
    systemd_exporter_version: "0.7.0"
    systemd_exporter_port: 9558

    install_dir: "/usr/local/bin"
    binary_path: "/usr/local/bin/systemd_exporter"

    download_dir: "/tmp/systemd_exporter_install"
    archive_path: "/tmp/systemd_exporter_install/systemd_exporter.tar.gz"

    service_file: "/etc/systemd/system/systemd_exporter.service"

  tasks:

    # ============================================================
    # SERVER INFORMATION
    # ============================================================

    - name: Display target server
      ansible.builtin.debug:
        msg:
          - "Server       : {{ inventory_hostname }}"
          - "IP           : {{ ansible_host | default(inventory_hostname) }}"
          - "OS           : {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Architecture : {{ ansible_architecture }}"


    # ============================================================
    # VERIFY ROOT
    # ============================================================

    - name: Check effective user
      ansible.builtin.command:
        cmd: whoami
      register: effective_user
      changed_when: false


    - name: Verify root privilege
      ansible.builtin.assert:
        that:
          - effective_user.stdout | trim == "root"
        fail_msg: "Ansible is not running as root."
        success_msg: "Ansible is running as root."


    # ============================================================
    # VERIFY ARCHITECTURE
    # ============================================================

    - name: Verify supported architecture
      ansible.builtin.assert:
        that:
          - ansible_architecture in ['x86_64', 'amd64']
        fail_msg: "Unsupported architecture: {{ ansible_architecture }}"
        success_msg: "Architecture {{ ansible_architecture }} is supported."


    # ============================================================
    # CREATE DOWNLOAD DIRECTORY
    # ============================================================

    - name: Create download directory
      ansible.builtin.file:
        path: "{{ download_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"


    # ============================================================
    # REMOVE OLD DOWNLOAD CONTENT
    # ============================================================

    - name: Remove old extraction directory
      ansible.builtin.file:
        path: "{{ download_dir }}/extracted"
        state: absent


    - name: Create extraction directory
      ansible.builtin.file:
        path: "{{ download_dir }}/extracted"
        state: directory
        owner: root
        group: root
        mode: "0755"


    # ============================================================
    # DOWNLOAD
    # ============================================================

    - name: Download systemd exporter
      ansible.builtin.get_url:
        url: "https://github.com/prometheus-community/systemd_exporter/releases/download/v{{ systemd_exporter_version }}/systemd_exporter-{{ systemd_exporter_version }}.linux-amd64.tar.gz"
        dest: "{{ archive_path }}"
        owner: root
        group: root
        mode: "0644"
        timeout: 120
        force: true


    # ============================================================
    # VERIFY DOWNLOAD
    # ============================================================

    - name: Check downloaded archive
      ansible.builtin.stat:
        path: "{{ archive_path }}"
      register: archive_status


    - name: Verify archive exists
      ansible.builtin.assert:
        that:
          - archive_status.stat.exists
          - archive_status.stat.size > 0
        fail_msg: "systemd exporter archive was not downloaded."


    # ============================================================
    # EXTRACT
    # ============================================================

    - name: Extract systemd exporter
      ansible.builtin.unarchive:
        src: "{{ archive_path }}"
        dest: "{{ download_dir }}/extracted"
        remote_src: true


    # ============================================================
    # SHOW EXTRACTED CONTENT
    # ============================================================

    - name: List extracted files
      ansible.builtin.find:
        paths: "{{ download_dir }}/extracted"
        recurse: true
        file_type: file
      register: extracted_files


    - name: Display extracted files
      ansible.builtin.debug:
        msg: "{{ extracted_files.files | map(attribute='path') | list }}"


    # ============================================================
    # FIND EXPORTER BINARY
    # ============================================================

    - name: Find systemd exporter executable
      ansible.builtin.find:
        paths: "{{ download_dir }}/extracted"
        recurse: true
        file_type: file
        patterns:
          - "systemd_exporter"
          - "systemd_exporter-*"
      register: exporter_files


    - name: Verify exporter binary
      ansible.builtin.assert:
        that:
          - exporter_files.files | length > 0
        fail_msg: >
          systemd_exporter binary was not found after extraction.
          Check the extracted files shown in the previous task.
        success_msg: "systemd_exporter binary found."


    # ============================================================
    # INSTALL DIRECTORY
    # ============================================================

    - name: Ensure /usr/local/bin exists
      ansible.builtin.file:
        path: "{{ install_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"


    # ============================================================
    # INSTALL BINARY
    # ============================================================

    - name: Install systemd exporter binary
      ansible.builtin.copy:
        src: "{{ exporter_files.files[0].path }}"
        dest: "{{ binary_path }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"


    # ============================================================
    # VERIFY BINARY
    # ============================================================

    - name: Check exporter binary
      ansible.builtin.stat:
        path: "{{ binary_path }}"
      register: exporter_binary_status


    - name: Verify exporter binary exists
      ansible.builtin.assert:
        that:
          - exporter_binary_status.stat.exists
          - exporter_binary_status.stat.executable
        fail_msg: "systemd_exporter binary installation failed."
        success_msg: "systemd_exporter binary installed successfully."


    - name: Get exporter version
      ansible.builtin.command:
        cmd: "{{ binary_path }} --version"
      register: exporter_version_output
      changed_when: false


    - name: Display exporter version
      ansible.builtin.debug:
        var: exporter_version_output.stdout


    # ============================================================
    # CREATE SYSTEMD SERVICE
    # ============================================================

    - name: Create systemd exporter service
      ansible.builtin.copy:
        dest: "{{ service_file }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus systemd Exporter
          Documentation=https://github.com/prometheus-community/systemd_exporter
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=simple

          ExecStart={{ binary_path }} --web.listen-address=0.0.0.0:{{ systemd_exporter_port }}

          Restart=on-failure
          RestartSec=5

          NoNewPrivileges=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
      notify: Restart systemd exporter


    # ============================================================
    # RELOAD SYSTEMD
    # ============================================================

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true


    # ============================================================
    # ENABLE AND START
    # ============================================================

    - name: Enable systemd exporter
      ansible.builtin.systemd:
        name: systemd_exporter
        enabled: true


    - name: Start systemd exporter
      ansible.builtin.systemd:
        name: systemd_exporter
        state: started


    # ============================================================
    # SERVICE STATUS
    # ============================================================

    - name: Get systemd exporter service status
      ansible.builtin.systemd:
        name: systemd_exporter
      register: exporter_service_status


    - name: Verify systemd exporter is active
      ansible.builtin.assert:
        that:
          - exporter_service_status.status.ActiveState == "active"
        fail_msg: "systemd_exporter service is not active."
        success_msg: "systemd_exporter service is active."


    # ============================================================
    # WAIT FOR PORT
    # ============================================================

    - name: Wait for exporter port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ systemd_exporter_port }}"
        state: started
        timeout: 30


    # ============================================================
    # TEST METRICS
    # ============================================================

    - name: Check exporter metrics endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ systemd_exporter_port }}/metrics"
        method: GET
        status_code: 200
        timeout: 10
        return_content: true
      register: exporter_metrics


    - name: Verify systemd metrics are available
      ansible.builtin.assert:
        that:
          - "'systemd' in exporter_metrics.content"
        fail_msg: "Exporter is running but expected systemd metrics were not found."
        success_msg: "Systemd metrics are available."


    # ============================================================
    # FIREWALL
    # ============================================================

    - name: Check firewalld
      ansible.builtin.command:
        cmd: firewall-cmd --state
      register: firewalld_status
      changed_when: false
      failed_when: false


    - name: Allow systemd exporter port
      ansible.builtin.command:
        cmd: firewall-cmd --permanent --add-port={{ systemd_exporter_port }}/tcp
      register: firewall_add
      changed_when: "'success' in firewall_add.stdout"
      when:
        - firewalld_status.rc == 0
        - firewalld_status.stdout | trim == "running"


    - name: Reload firewalld
      ansible.builtin.command:
        cmd: firewall-cmd --reload
      when:
        - firewalld_status.rc == 0
        - firewalld_status.stdout | trim == "running"
        - firewall_add is defined
        - firewall_add.changed


    # ============================================================
    # CLEANUP
    # ============================================================

    - name: Remove temporary files
      ansible.builtin.file:
        path: "{{ download_dir }}"
        state: absent


    # ============================================================
    # FINAL RESULT
    # ============================================================

    - name: Display final result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SYSTEMD EXPORTER INSTALLATION COMPLETED"
          - "============================================================"
          - "Server       : {{ inventory_hostname }}"
          - "IP           : {{ ansible_host | default(inventory_hostname) }}"
          - "Version      : {{ systemd_exporter_version }}"
          - "Binary       : {{ binary_path }}"
          - "Port         : {{ systemd_exporter_port }}"
          - "Service      : ACTIVE"
          - "Enabled      : YES"
          - "Metrics      : http://{{ ansible_host | default(inventory_hostname) }}:{{ systemd_exporter_port }}/metrics"
          - "============================================================"


  handlers:

    - name: Restart systemd exporter
      ansible.builtin.systemd:
        name: systemd_exporter
        state: restarted
        daemon_reload: true
